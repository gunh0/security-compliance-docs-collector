<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{.Meta.Title}} {{with .Meta.Version}}v{{.}}{{end}} · Compliance Docs Collector</title>
        <link rel="icon" href="data:,">
        <link rel="stylesheet" href="/static/style.css">
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/9.9.2/jsoneditor.min.js"></script>
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/jsoneditor/9.9.2/jsoneditor.min.css">
    </head>
    <body>
        <header class="hero hero-compact">
            <div class="container">
                <a class="back" href="/">&larr; All documents</a>
                {{with .Meta}}
                <p class="eyebrow">{{with .Framework}}{{.}} · {{end}}{{.Provider}}</p>
                <h1>{{.Title}} {{with .Version}}<span class="pill">v{{.}}</span>{{end}}</h1>
                {{with .Description}}<p class="lead">{{.}}</p>{{end}}
                <dl class="stats">
                    <div><dt>Requirements</dt><dd>{{.Requirements}}</dd></div>
                    <div><dt>File</dt><dd class="mono">{{$.FilePath}}</dd></div>
                </dl>
                {{end}}
            </div>
        </header>

        <main class="container">
            <div id="json-viewer"></div>
        </main>

        <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('json-viewer');
            const options = {
                mode: 'tree',
                modes: ['tree', 'view', 'form', 'code', 'text'],
            };
            const editor = new JSONEditor(container, options);
            const json = {{.Content}};
            editor.set(json);
            editor.expandAll();
        });
    </script>
    </body>
</html>
